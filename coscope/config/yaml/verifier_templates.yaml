# Verifier Query Templates

# MuSiQue
musique.bridge: "Verify the credibility and temporal consistency of each hop's conclusion source in the reasoning chain."

# 2WikiMultiHopQA
2wikimultihopqa.compositional: "Verify entity-reference consistency of the reasoning chain: does the intermediate entity refer to the same object across both hops?"
2wikimultihopqa.inference: "Verify entity-reference consistency of the reasoning chain: does the intermediate entity refer to the same object across both hops?"
2wikimultihopqa.bridge_comparison: "Verify comparability of bridge-entity attributes: do the two reasoning chains linked by the bridge entity operate on the same attribute dimension?"
2wikimultihopqa.comparison: "Compare attribute consistency of the two entities: are the target attributes of both entities directly comparable?"

# HotpotQA
hotpotqa.bridge: "Verify the credibility and temporal consistency of each hop's conclusion source in the reasoning chain."
hotpotqa.comparison: "Verify whether the comparative evidence sources for the two entities are authoritative and free of conflict."

# GSM8K
gsm8k: "Verify whether each step's numeric computation result is consistent with the gold intermediate value."

# MATH (by category)
math.algebra: "Verify whether each step's equation transformation is consistent and numeric results are self-consistent."
math.geometry: "Verify whether references to geometric relations and properties are correct."
math.probability: "Verify completeness of the sample space and accuracy of probability calculations."
math.number_theory: "Verify correct application of divisibility, congruence, and related properties."
math.counting_and_probability: "Verify correctness of combinatorial counting methods and permutation results."
math.intermediate_algebra: "Verify consistency of algebraic transformation steps and equation-solving procedures."
math.precalculus: "Verify correct application of functions, limits, and trigonometric identities."
math.prealgebra: "Verify accuracy of basic algebraic operations and numeric calculations."
