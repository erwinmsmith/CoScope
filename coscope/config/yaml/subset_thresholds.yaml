# ρ thresholds for S1 / S2 / S3 subset assignment.
#
# Empirical distribution on MuSiQue 2-hop dev under the pairwise-mean-IoU
# rho formula (coscope/graph/got/rho_calculator.py, aligned with v3):
#   - FORK              ρ ≈ 0.000
#   - INDEPENDENT       ρ ≈ 0.167
#   - FORK_MERGE        ρ ≈ 0.222
#   - LINEAR  (2-hop)   ρ ≈ 0.500
#   - POLICY_ISOLATED   ρ ≈ 0.500  (+ s4_eligible)
#
# Rule:
#   S1: ρ >  s1_threshold           (LINEAR, POLICY_ISOLATED)
#   S2: s3_upper  <  ρ  ≤  s1_threshold  (FORK_MERGE, INDEPENDENT)
#   S3: ρ ≤  s3_upper               (FORK)
#
# (s2_lower is a readability alias for s3_upper; both must be equal.)

s1_threshold: 0.3
s2_lower: 0.1
s3_upper: 0.1
