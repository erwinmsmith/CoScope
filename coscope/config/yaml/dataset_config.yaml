# GoT-MAS Dataset Configuration

datasets:
  musique:
    raw_path: "raw/musique"
    train_file: "musique_ans_v1.0_train.jsonl"
    dev_file: "musique_ans_v1.0_dev.jsonl"
    test_file: null
    hop_field: "question_decomposition"
    answer_field: "answer"
    question_field: "question"
    paragraphs_field: "paragraphs"
    task_type: "multihop_qa"
    task_shared_mode: "realtime"  # realtime / oracle
    
  2wikimultihopqa:
    raw_path: "raw/2wikimultihopqa"
    train_file: "train.json"
    dev_file: "dev.json"
    test_file: "test.json"
    hop_field: null
    answer_field: "answer"
    question_field: "question"
    context_field: "context"
    task_type: "multihop_qa"
    task_shared_mode: "realtime"
    
  hotpotqa:
    raw_path: "raw/hotpotqa"
    train_file: "distractor_train_00000.parquet"
    dev_file: "distractor_validation.parquet"
    test_file: null
    task_type: "multihop_qa"
    task_shared_mode: "realtime"
    
  gsm8k:
    raw_path: "raw/gsm8k"
    train_file: "train.parquet"
    dev_file: null  # sampled from train by SplitManager
    test_file: "test.parquet"
    task_type: "math_reasoning"
    task_shared_mode: "oracle"
    dev_ratio: 0.10
    
  math:
    raw_path: "raw/math"
    train_file: "train.parquet"
    dev_file: null  # sampled from train by SplitManager
    test_file: "test.parquet"
    task_type: "math_reasoning"
    task_shared_mode: "oracle"
    dev_ratio: 0.10

# Subset partition thresholds
subset_thresholds:
  s1_min: 0.7
  s2_min: 0.4
  s2_max: 0.7
  s3_max: 0.4

# Target sample counts (per subset, dev set)
target_samples:
  musique:
    s1: 800
    s2: 600
    s3: 400
    s4: 400
  2wikimultihopqa:
    s1: 800
    s2: 700
    s3: 400
    s4: 400
  hotpotqa:
    s1: 600
    s2: 600
    s3: 400
    s4: 400
  gsm8k:
    s1: 700
    s2: 500
    s3: 300
    s4: 300
  math:
    s1: 700
    s2: 500
    s3: 300
    s4: 300

# Global config
global:
  seed: 42
  schema_version: "1.0"
  max_workers: 8
