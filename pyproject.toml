[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coscope"
version = "0.2.0"
description = "Scope-aware context and retrieval runtime for multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CoScope Authors"}]
dependencies = [
    "numpy>=1.24",
    "openai>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
bench = [
    "pyarrow>=15.0",
    "pylatexenc>=2.10",
    "sympy>=1.12",
]

[project.urls]
Repository = "https://github.com/erwinmsmith/CoScope"

[tool.setuptools.packages.find]
where = ["."]
include = ["coscope*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["CoScope_unified", "raw", "eval", "logs", "new_results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "^(CoScope_unified|build|raw|eval|logs|new_results)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
